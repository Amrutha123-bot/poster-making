<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#D0021B"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="250" cy="250" r="220" fill="url(#glow)" />

  <!-- Outer Ring with Small Dots -->
  <circle cx="250" cy="250" r="180" fill="none" stroke="url(#gold)" stroke-width="2" stroke-dasharray="4,8" opacity="0.6"/>

  <!-- Main Mandala Body -->
  <g transform="translate(250,250)" stroke="url(#gold)" stroke-width="1.5" fill="none">
    <!-- 12 Petals Layer 1 -->
    <g>
      <path d="M0,0 C20,-50 20,-100 0,-140 C-20,-100 -20,-50 0,0" />
      <path d="M0,0 C20,-50 20,-100 0,-140 C-20,-100 -20,-50 0,0" transform="rotate(30)" />
      <path d="M0,0 C20,-50 20,-100 0,-140 C-20,-100 -20,-50 0,0" transform="rotate(60)" />
      <path d="M0,0 C20,-50 20,-100 0,-140 C-20,-100 -20,-50 0,0" transform="rotate(90)" />
      <path d="M0,0 C20,-50 20,-100 0,-140 C-20,-100 -20,-50 0,0" transform="rotate(120)" />
      <path d="M0,0 C20,-50 20,-100 0,-140 C-20,-100 -20,-50 0,0" transform="rotate(150)" />
      <path d="M0,0 C20,-50 20,-100 0,-140 C-20,-100 -20,-50 0,0" transform="rotate(180)" />
      <path d="M0,0 C20,-50 20,-100 0,-140 C-20,-100 -20,-50 0,0" transform="rotate(210)" />
      <path d="M0,0 C20,-50 20,-100 0,-140 C-20,-100 -20,-50 0,0" transform="rotate(240)" />
      <path d="M0,0 C20,-50 20,-100 0,-140 C-20,-100 -20,-50 0,0" transform="rotate(270)" />
      <path d="M0,0 C20,-50 20,-100 0,-140 C-20,-100 -20,-50 0,0" transform="rotate(300)" />
      <path d="M0,0 C20,-50 20,-100 0,-140 C-20,-100 -20,-50 0,0" transform="rotate(330)" />
    </g>

    <!-- Inner Flower Layer 2 -->
    <g opacity="0.8">
      <path d="M0,0 C15,-30 15,-60 0,-90 C-15,-60 -15,-30 0,0" transform="rotate(15)" />
      <path d="M0,0 C15,-30 15,-60 0,-90 C-15,-60 -15,-30 0,0" transform="rotate(45)" />
      <path d="M0,0 C15,-30 15,-60 0,-90 C-15,-60 -15,-30 0,0" transform="rotate(75)" />
      <path d="M0,0 C15,-30 15,-60 0,-90 C-15,-60 -15,-30 0,0" transform="rotate(105)" />
      <path d="M0,0 C15,-30 15,-60 0,-90 C-15,-60 -15,-30 0,0" transform="rotate(135)" />
      <path d="M0,0 C15,-30 15,-60 0,-90 C-15,-60 -15,-30 0,0" transform="rotate(165)" />
      <path d="M0,0 C15,-30 15,-60 0,-90 C-15,-60 -15,-30 0,0" transform="rotate(195)" />
      <path d="M0,0 C15,-30 15,-60 0,-90 C-15,-60 -15,-30 0,0" transform="rotate(225)" />
      <path d="M0,0 C15,-30 15,-60 0,-90 C-15,-60 -15,-30 0,0" transform="rotate(255)" />
      <path d="M0,0 C15,-30 15,-60 0,-90 C-15,-60 -15,-30 0,0" transform="rotate(285)" />
      <path d="M0,0 C15,-30 15,-60 0,-90 C-15,-60 -15,-30 0,0" transform="rotate(315)" />
      <path d="M0,0 C15,-30 15,-60 0,-90 C-15,-60 -15,-30 0,0" transform="rotate(345)" />
    </g>

    <!-- Starburst Inner Ring -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-dasharray="2,4"/>

    <!-- Geometric Interlocking Center -->
    <polygon points="0,-30 26,15 -26,15" opacity="0.9"/>
    <polygon points="0,30 26,-15 -26,-15" opacity="0.9"/>

    <!-- Central Flame/Bindu -->
    <circle cx="0" cy="0" r="10" fill="url(#gold)" stroke="none"/>
  </g>

  <!-- Ground Diya Base below mandala -->
  <g transform="translate(250, 410)">
    <!-- Diya oil clay lamp -->
    <path d="M-60,0 C-60,40 60,40 60,0 C40,-10 -40,-10 -60,0 Z" fill="url(#gold)"/>
    <!-- Flame -->
    <path d="M0,-10 C-15,-25 0,-50 0,-50 C0,-50 15,-25 0,-10 Z" fill="#FFCC00" filter="drop-shadow(0px 0px 8px #FF6600)"/>
    <path d="M0,-12 C-8,-20 0,-38 0,-38 C0,-38 8,-20 0,-12 Z" fill="#FFA500"/>
    <path d="M0,-15 C-4,-20 0,-28 0,-28 C0,-28 4,-20 0,-15 Z" fill="#FFFFCC"/>
  </g>
</svg>
