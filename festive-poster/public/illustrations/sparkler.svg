<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="sparkle-glow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#FFDD55" stop-opacity="1"/>
      <stop offset="20%" stop-color="#FFAA00" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF5500" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background sparkle particles group -->
  <g opacity="0.8">
    <!-- Star rays radiating -->
    <line x1="250" y1="100" x2="250" y2="400" stroke="#FFD700" stroke-width="2" stroke-dasharray="10,20"/>
    <line x1="100" y1="250" x2="400" y2="250" stroke="#FFD700" stroke-width="2" stroke-dasharray="10,20"/>
    <line x1="144" y1="144" x2="356" y2="356" stroke="#FFD700" stroke-dasharray="5,15" stroke-width="1.5"/>
    <line x1="144" y1="356" x2="356" y2="144" stroke="#FFD700" stroke-dasharray="5,15" stroke-width="1.5"/>
  </g>

  <!-- Sparkler Stem / Holder -->
  <line x1="250" y1="250" x2="250" y2="450" stroke="#777" stroke-width="5" stroke-linecap="round"/>
  <rect x="246" y="245" width="8" height="120" fill="#444" rx="4"/>

  <!-- Centered Sparkle Explosions -->
  <circle cx="250" cy="245" r="120" fill="url(#sparkle-glow)"/>

  <!-- Detailed Spark Elements -->
  <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round">
    <line x1="250" y1="245" x2="210" y2="205" />
    <line x1="250" y1="245" x2="290" y2="205" />
    <line x1="250" y1="245" x2="210" y2="285" />
    <line x1="250" y1="245" x2="290" y2="285" />

    <line x1="250" y1="245" x2="250" y2="185" stroke-width="3" stroke="#FFDD44" />
    <line x1="250" y1="245" x2="250" y2="305" stroke-width="3" stroke="#FFDD44" />
    <line x1="250" y1="245" x2="190" y2="245" stroke-width="3" stroke="#FFDD44" />
    <line x1="250" y1="245" x2="310" y2="245" stroke-width="3" stroke="#FFDD44" />
  </g>

  <!-- Floating Spark Dots -->
  <g fill="#FFF">
    <circle cx="200" cy="180" r="3" fill="#FFE066" filter="drop-shadow(0 0 2px #FFA500)"/>
    <circle cx="310" cy="170" r="2.5" fill="#FFF"/>
    <circle cx="160" cy="250" r="4" fill="#FFBB00" filter="drop-shadow(0 0 3px #FFA500)"/>
    <circle cx="330" cy="230" r="3" fill="#FFDD66"/>
    <circle cx="220" cy="320" r="2" fill="#FFF"/>
    <circle cx="280" cy="310" r="3.5" fill="#FF6600"/>
    <circle cx="250" cy="150" r="3" fill="#FFE066"/>
    <circle cx="270" cy="190" r="1.5" fill="#FFF"/>
    <circle cx="230" cy="210" r="2" fill="#FFF"/>
  </g>
</svg>
