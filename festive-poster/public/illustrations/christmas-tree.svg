<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="tree-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#F5A623"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Stars in background -->
  <g fill="#FFF" opacity="0.3">
    <circle cx="100" cy="80" r="2" />
    <circle cx="420" cy="120" r="1.5" />
    <circle cx="150" cy="220" r="1" />
    <circle cx="380" cy="250" r="2.5" />
    <circle cx="80" cy="300" r="1.5" />
  </g>

  <!-- Christmas Tree Body (Geometric Layers) -->
  <g filter="url(#shadow)">
    <!-- Base Trunk -->
    <rect x="235" y="380" width="30" height="50" fill="#5D4037" rx="3"/>

    <!-- Bottom Tier -->
    <path d="M120,380 L380,380 L250,240 Z" fill="url(#tree-grad)"/>

    <!-- Middle Tier -->
    <path d="M140,290 L360,290 L250,170 Z" fill="url(#tree-grad)"/>

    <!-- Top Tier -->
    <path d="M170,200 L330,200 L250,100 Z" fill="url(#tree-grad)"/>
  </g>

  <!-- Star on Top -->
  <g transform="translate(250, 90)" fill="url(#gold-grad)">
    <polygon points="0,-22 6,-6 23,-6 9,4 14,20 0,10 -14,20 -9,4 -23,-6 -6,-6" filter="drop-shadow(0 0 6px #F5A623)"/>
  </g>

  <!-- Decorative Baubles -->
  <circle cx="210" cy="260" r="8" fill="#D32F2F" filter="drop-shadow(0 2px 2px rgba(0,0,0,0.2))"/>
  <circle cx="290" cy="270" r="8" fill="#F5A623"/>
  <circle cx="250" cy="180" r="7" fill="#E91E63"/>
  <circle cx="200" cy="340" r="9" fill="#1976D2"/>
  <circle cx="300" cy="350" r="9" fill="#D32F2F"/>
  <circle cx="250" cy="310" r="8" fill="#FFEB3B"/>

  <!-- Wave ornament swooshes -->
  <path d="M178,200 Q250,230 322,200" fill="none" stroke="#FFEB3B" stroke-width="2.5" stroke-dasharray="3,6" opacity="0.8"/>
  <path d="M148,290 Q250,330 352,290" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="3,6" opacity="0.8"/>
</svg>
